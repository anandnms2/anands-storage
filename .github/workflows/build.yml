name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seaweed_ref:
        description: "Upstream SeaweedFS tag to build (default: the one pinned in Dockerfile)"
        required: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          ref="${{ inputs.seaweed_ref }}"
          [ -n "$ref" ] || ref=$(grep -m1 '^ARG SEAWEED_REF=' Dockerfile | cut -d= -f2)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SEAWEED_REF=${{ steps.ref.outputs.ref }}
          tags: |
            ghcr.io/anandnms2/anands-storage:latest
            ghcr.io/anandnms2/anands-storage:${{ steps.ref.outputs.ref }}
