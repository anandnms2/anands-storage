name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly rebuild to pick up base-image patches
  workflow_dispatch:
    inputs:
      seaweed_ref:
        description: "Upstream SeaweedFS tag to build (e.g. 4.13)"
        required: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            SEAWEED_REF=${{ inputs.seaweed_ref || '4.13' }}
          tags: ghcr.io/anandnms2/anands-storage:latest
